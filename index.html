<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Lounge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>🎰 Lucky Lounge</h1>

        <div class="balance">
            💰 Coins:
            <span id="coins">1000</span>
        </div>

        <button id="dailyReward">
            🎁 Daily Reward
        </button>
    </header>

    <main>

        <div class="games">

            <a class="game" href="games/slots.html">
                <div class="emoji">🎰</div>
                <h2>Slots</h2>
                <p>Spin for huge multipliers.</p>
            </a>

            <a class="game" href="games/blackjack.html">
                <div class="emoji">🃏</div>
                <h2>Blackjack</h2>
                <p>Beat the dealer.</p>
            </a>

            <a class="game" href="games/coinflip.html">
                <div class="emoji">🪙</div>
                <h2>Coin Flip</h2>
                <p>Choose Heads or Tails.</p>
            </a>

            <a class="game" href="games/cups.html">
                <div class="emoji">🥤</div>
                <h2>Cups</h2>
                <p>Find the winning cup.</p>
            </a>

            <a class="game" href="games/fishing.html">
                <div class="emoji">🐟</div>
                <h2>Fishing</h2>
                <p>Catch rare fish for coins.</p>
            </a>

        </div>

    </main>

    <script>
        let coins = Number(localStorage.getItem("coins")) || 1000;

        const coinText = document.getElementById("coins");
        coinText.textContent = coins;

        const rewardButton = document.getElementById("dailyReward");

        rewardButton.onclick = function () {

            const now = Date.now();
            const last = Number(localStorage.getItem("dailyReward")) || 0;

            if (now - last < 86400000) {

                const hours = Math.ceil((86400000 - (now - last)) / 3600000);
                alert("Come back in " + hours + " hour(s).");
                return;

            }

            coins += 1000;

            localStorage.setItem("coins", coins);
            localStorage.setItem("dailyReward", now);

            coinText.textContent = coins;

            alert("🎉 You claimed 1,000 coins!");
        };
    </script>

</body>
</html>
