<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Lucky Lounge
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>



<div class="menu">



    <!-- HEADER -->

    <div class="top">


        <div class="logo">

            🎲 LUCKY LOUNGE

        </div>



        <div class="coins">

            🪙

            <span id="coins">
                0
            </span>

        </div>


    </div>







    <!-- DAILY REWARD -->


    <div class="daily">


        <div>

            🎁 Daily Reward

        </div>



        <button
        onclick="claimDailyReward()">

            CLAIM

        </button>


    </div>







    <!-- TITLE -->


    <h1>

        GAMES

    </h1>







    <!-- GAME BUTTONS -->


    <div class="buttons">



        <button
        class="game-btn"
        onclick="location.href='games/slots.html'">


            <span>
                🎰
            </span>


            <div>
                Slots
            </div>


        </button>






        <button
        class="game-btn"
        onclick="location.href='games/blackjack.html'">


            <span>
                🃏
            </span>


            <div>
                Blackjack
            </div>


        </button>






        <button
        class="game-btn"
        onclick="location.href='games/cups.html'">


            <span>
                🥤
            </span>


            <div>
                Lucky Cups
            </div>


        </button>







        <button
        class="game-btn"
        onclick="location.href='games/coinflip.html'">


            <span>
                🪙
            </span>


            <div>
                Coin Flip
            </div>


        </button>







        <button
        class="game-btn"
        onclick="location.href='games/fishing.html'">


            <span>
                🎣
            </span>


            <div>
                Fishing
            </div>


        </button>







        <button
        class="game-btn"
        onclick="location.href='rewards.html'">


            <span>
                🎁
            </span>


            <div>
                Rewards
            </div>


        </button>





    </div>




</div>






<!-- SCRIPTS -->

<script src="js/currency.js"></script>

<script src="js/sounds.js"></script>

<script src="js/rewards.js"></script>



</body>

</html>
