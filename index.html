<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucky Lounge</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="menu">


    <!-- TOP HEADER -->

    <div class="top">


        <div class="logo">

            🎲 LUCKY LOUNGE

        </div>



        <div class="coins">

            🪙

            <span id="coins">
                0
            </span>

        </div>


    </div>







    <!-- DAILY REWARD -->


    <div class="daily">


        <div>

            🎁 Daily Reward

        </div>



        <button onclick="claimDailyReward()">

            CLAIM

        </button>


    </div>







    <!-- MENU TITLE -->


    <h1>

        GAMES

    </h1>








    <!-- GAME MENU -->


    <div class="buttons">





        <button 
        class="game-btn slots"
        onclick="location.href='games/slots.html'">


            <span>
                🎰
            </span>


            Slots


        </button>








        <button 
        class="game-btn blackjack"
        onclick="location.href='games/blackjack.html'">


            <span>
                🃏
            </span>


            Blackjack


        </button>








        <button 
        class="game-btn cups"
        onclick="location.href='games/cups.html'">


            <span>
                🥤
            </span>


            Lucky Cups


        </button>








        <button 
        class="game-btn flip"
        onclick="location.href='games/coinflip.html'">


            <span>
                🪙
            </span>


            Coin Flip


        </button>








        <button 
        class="game-btn fish"
        onclick="location.href='games/fishing.html'">


            <span>
                🎣
            </span>


            Fishing


        </button>








        <button 
        class="game-btn rewards"
        onclick="location.href='rewards.html'">


            <span>
                🎁
            </span>


            Rewards


        </button>






    </div>







</div>






<script src="js/currency.js"></script>

<script src="js/sounds.js"></script>


</body>

</html>
