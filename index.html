<!DOCTYPE html>
<html>

<head>

<title>Lucky Lounge</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="menu">


    <!-- HEADER -->

    <div class="top">


        <div class="logo">

            🎲 LUCKY LOUNGE

        </div>


        <div class="coins">

            🪙 <span id="coins">0</span>

        </div>


    </div>





    <!-- DAILY -->

    <div class="daily">

        🎁 Daily Reward

        <button onclick="claimDailyReward()">
            CLAIM
        </button>

    </div>







    <h1>
        GAMES
    </h1>





    <!-- GAME BUTTONS -->


    <div class="buttons">


        <button class="game-btn slots"
        onclick="location.href='games/slots.html'">

            <span>
                🎰
            </span>

            Slots

        </button>





        <button class="game-btn blackjack"
        onclick="location.href='games/blackjack.html'">

            <span>
                🃏
            </span>

            Blackjack

        </button>





        <button class="game-btn cups"
        onclick="location.href='games/cups.html'">

            <span>
                🥤
            </span>

            Lucky Cups

        </button>





        <button class="game-btn flip"
        onclick="location.href='games/coinflip.html'">

            <span>
                🪙
            </span>

            Coin Flip

        </button>





        <button class="game-btn fish"
        onclick="location.href='games/fishing.html'">

            <span>
                🎣
            </span>

            Fishing

        </button>



    </div>



</div>



<script src="js/currency.js"></script>


</body>

</html>
