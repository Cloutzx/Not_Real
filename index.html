<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucky Lounge</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="lobby">



    <!-- HEADER -->

    <div class="header">


        <div class="logo">

            🎲 LUCKY LOUNGE

        </div>



        <div class="currency-box">


            <span class="coin-icon">
                🪙
            </span>


            <span id="coins">
                0
            </span>


        </div>


    </div>






    <!-- DAILY -->


    <div class="daily-card">


        <div class="daily-icon">

            🎁

        </div>


        <div>

            <h2>
                Daily Reward
            </h2>


            <p>
                Come back every day for bonus coins!
            </p>


        </div>


        <button onclick="claimDailyReward()">

            CLAIM

        </button>


    </div>







    <!-- TITLE -->


    <h1 class="main-title">

        CHOOSE A GAME

    </h1>





    <!-- GAMES -->


    <div class="game-menu">



        <div class="game-card slots"
        onclick="location.href='games/slots.html'">

            <div class="game-image">
                🎰
            </div>

            <h2>
                SLOTS
            </h2>

            <button>
                PLAY NOW
            </button>

        </div>






        <div class="game-card blackjack"
        onclick="location.href='games/blackjack.html'">

            <div class="game-image">
                🃏
            </div>

            <h2>
                BLACKJACK
            </h2>

            <button>
                PLAY NOW
            </button>

        </div>







        <div class="game-card cups"
        onclick="location.href='games/cups.html'">

            <div class="game-image">
                🥤
            </div>

            <h2>
                LUCKY CUPS
            </h2>

            <button>
                PLAY NOW
            </button>

        </div>







        <div class="game-card coin"
        onclick="location.href='games/coinflip.html'">

            <div class="game-image">
                🪙
            </div>

            <h2>
                COIN FLIP
            </h2>

            <button>
                PLAY NOW
            </button>

        </div>







        <div class="game-card fishing"
        onclick="location.href='games/fishing.html'">

            <div class="game-image">
                🎣
            </div>

            <h2>
                FISHING
            </h2>

            <button>
                PLAY NOW
            </button>

        </div>




    </div>





</div>




<script src="js/currency.js"></script>

<script src="js/sounds.js"></script>


</body>

</html>
