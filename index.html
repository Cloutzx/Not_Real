<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucky Lounge</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="container">



    <!-- TOP HUD -->

    <div class="topbar">


        <div class="currency">

            💰 Coins:

            <span id="coins">
                0
            </span>


        </div>




        <div class="daily">


            <h2>
                🎁 Daily Reward
            </h2>


            <button onclick="claimDailyReward()">

                CLAIM

            </button>


        </div>


    </div>







    <h1 class="title">

        LUCKY LOUNGE

    </h1>





    <p style="text-align:center;opacity:.8;font-size:20px;">

        Choose a game and test your luck

    </p>







    <!-- GAME BUTTONS -->


    <div class="games">





        <div class="game" onclick="location.href='games/slots.html'">


            <div class="game-icon">

                🎰

            </div>


            <div class="game-name">

                Slots

            </div>


            <button class="game-button">

                PLAY

            </button>


        </div>








        <div class="game" onclick="location.href='games/blackjack.html'">


            <div class="game-icon">

                🃏

            </div>


            <div class="game-name">

                Blackjack

            </div>


            <button class="game-button">

                PLAY

            </button>


        </div>








        <div class="game" onclick="location.href='games/cups.html'">


            <div class="game-icon">

                🥤

            </div>


            <div class="game-name">

                Lucky Cups

            </div>


            <button class="game-button">

                PLAY

            </button>


        </div>








        <div class="game" onclick="location.href='games/coinflip.html'">


            <div class="game-icon">

                🪙

            </div>


            <div class="game-name">

                Coin Flip

            </div>


            <button class="game-button">

                PLAY

            </button>


        </div>







        <div class="game" onclick="location.href='games/fishing.html'">


            <div class="game-icon">

                🎣

            </div>


            <div class="game-name">

                Fishing

            </div>


            <button class="game-button">

                PLAY

            </button>


        </div>






    </div>





</div>







<script src="js/currency.js"></script>

<script src="js/sounds.js"></script>



</body>

</html>
