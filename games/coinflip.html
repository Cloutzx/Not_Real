<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucky Lounge Coin Flip</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>



<div class="game-page">


<div class="game-container">



<h1 class="game-title">

🪙 Coin Flip

</h1>





<div class="money">

🪙 Coins:

<span id="coins">

0

</span>

</div>








<div class="bet-box">


<input

id="bet"

type="number"

placeholder="Enter Bet Amount"

min="1">


</div>









<div class="coin-area">


<div id="coin" class="coin">


🪙


</div>


</div>








<div class="choice">


<button

class="game-action"

onclick="flipCoin('Heads')">

Heads


</button>




<button

class="game-action"

onclick="flipCoin('Tails')">

Tails


</button>


</div>







<h2 id="result">


Choose Heads or Tails


</h2>







<button

class="game-action"

onclick="window.location.href='../index.html'">


← Back


</button>







</div>


</div>








<script src="../js/currency.js"></script>

<script src="../js/coinflip.js"></script>

<script src="../js/sounds.js"></script>



</body>

</html>
