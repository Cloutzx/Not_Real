<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucky Lounge Rewards</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game-page">


    <div class="game-container rewards-page">



        <h1 class="game-title">

            🎁 Rewards

        </h1>




        <div class="reward-card">


            <div class="reward-icon">

                🎁

            </div>



            <h2>

                Daily Reward

            </h2>



            <p>

                Claim free coins every 24 hours!

            </p>



            <div class="reward-amount">

                🪙 +500 Coins

            </div>



            <button 
            class="game-action"
            onclick="claimDailyReward()">

                CLAIM REWARD

            </button>



        </div>







        <div class="reward-card locked">


            <div class="reward-icon">

                🔒

            </div>



            <h2>

                Weekly Reward

            </h2>



            <p>

                Coming Soon...

            </p>



        </div>








        <div class="reward-card locked">


            <div class="reward-icon">

                ⭐

            </div>



            <h2>

                VIP Rewards

            </h2>



            <p>

                Exclusive rewards for VIP players

            </p>



        </div>






        <button 
        class="game-action"
        onclick="window.location.href='index.html'">

            ← BACK TO MENU

        </button>





    </div>


</div>







<script src="js/currency.js"></script>

<script src="js/rewards.js"></script>

<script src="js/sounds.js"></script>



</body>

</html>
