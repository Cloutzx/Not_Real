<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucky Lounge Blackjack</title>

<link rel="stylesheet" href="../style.css">

</head>


<body>



<div class="game-page">


<div class="game-container">



<h1 class="game-title">

🃏 Blackjack

</h1>





<div class="money">

🪙 Coins:
<span id="coins">
0
</span>

</div>







<div class="bet-box">


<input 
id="bet"
type="number"
placeholder="Enter Bet Amount"
min="1">


</div>







<h2>

Dealer

</h2>


<div id="dealerCards">


</div>



<h3>

Dealer Score:

<span id="dealerScore">

?

</span>

</h3>









<h2>

You

</h2>


<div id="playerCards">


</div>



<h3>

Your Score:

<span id="playerScore">

0

</span>

</h3>







<div class="actions">


<button
class="game-action"
onclick="startGame()">

Start

</button>




<button
class="game-action"
onclick="hit()">

Hit

</button>





<button
class="game-action"
onclick="stand()">

Stand

</button>


</div>







<h2 id="result">


</h2>






<button
class="game-action"
onclick="window.location.href='../index.html'">

← Back

</button>






</div>


</div>







<script src="../js/currency.js"></script>

<script src="../js/blackjack.js"></script>

<script src="../js/sounds.js"></script>



</body>

</html>
