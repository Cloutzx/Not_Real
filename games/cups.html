<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cups | Lucky Lounge</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body>


<div class="game-container">


    <h1 class="game-title">
        🥤 Cup Game
    </h1>




    <div class="game-balance">

        💰 Coins:
        <span id="coins">
            0
        </span>

    </div>





    <p>
        Pick the cup hiding the prize!
    </p>





    <input

        id="bet"

        type="number"

        placeholder="Enter bet amount"

        min="1"

    >





    <br><br>





    <div class="cups">


        <button class="cup" onclick="pickCup(1)">

            🥤

        </button>



        <button class="cup" onclick="pickCup(2)">

            🥤

        </button>



        <button class="cup" onclick="pickCup(3)">

            🥤

        </button>


    </div>







    <h2 id="result">

    </h2>







    <button onclick="resetGame()">

        🔄 New Round

    </button>







    <br><br>







    <a class="back" href="../index.html">

        ← Back to Lobby

    </a>


</div>







<script src="../js/currency.js"></script>

<script src="../js/sounds.js"></script>

<script src="../js/cups.js"></script>



</body>

</html>
